<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="55%" stop-color="#1F4E79"/>
      <stop offset="100%" stop-color="#0E2A4F"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FC3FF"/>
      <stop offset="50%" stop-color="#2E9BE8"/>
      <stop offset="100%" stop-color="#6FC3FF"/>
    </linearGradient>
  </defs>

  <!-- Coin mark (scaled) -->
  <g transform="translate(40,40) scale(0.625)">
    <circle cx="256" cy="256" r="248" fill="url(#coinGrad)"/>
    <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
    <g stroke="#FFFFFF" stroke-width="42" stroke-linecap="round" fill="none">
      <line x1="182" y1="148" x2="182" y2="364"/>
      <line x1="196" y1="256" x2="316" y2="150"/>
      <line x1="196" y1="256" x2="326" y2="364"/>
    </g>
    <circle cx="342" cy="128" r="20" fill="#F5B841"/>
    <circle cx="342" cy="128" r="20" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.85"/>
    <line x1="316" y1="150" x2="330" y2="139" stroke="#F5B841" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="420" y="215" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="4" fill="#1F4E79">KROVA<tspan fill="#2E9BE8">COIN</tspan></text>
  <text x="424" y="272" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="14" fill="#6B7A8D">PROOF OF STAKE · KROV</text>
</svg>
