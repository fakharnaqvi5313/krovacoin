<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="55%" stop-color="#1F4E79"/>
      <stop offset="100%" stop-color="#0E2A4F"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FC3FF"/>
      <stop offset="50%" stop-color="#2E9BE8"/>
      <stop offset="100%" stop-color="#6FC3FF"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6EBFF"/>
    </linearGradient>
  </defs>

  <!-- Coin face -->
  <circle cx="256" cy="256" r="248" fill="url(#coinGrad)"/>

  <!-- Reeded coin edge (tick marks) -->
  <g stroke="#6FC3FF" stroke-width="3" opacity="0.55">
    <g id="ticks">
      <line x1="256" y1="12" x2="256" y2="26"/>
    </g>
    <use href="#ticks" transform="rotate(15 256 256)"/>
    <use href="#ticks" transform="rotate(30 256 256)"/>
    <use href="#ticks" transform="rotate(45 256 256)"/>
    <use href="#ticks" transform="rotate(60 256 256)"/>
    <use href="#ticks" transform="rotate(75 256 256)"/>
    <use href="#ticks" transform="rotate(90 256 256)"/>
    <use href="#ticks" transform="rotate(105 256 256)"/>
    <use href="#ticks" transform="rotate(120 256 256)"/>
    <use href="#ticks" transform="rotate(135 256 256)"/>
    <use href="#ticks" transform="rotate(150 256 256)"/>
    <use href="#ticks" transform="rotate(165 256 256)"/>
    <use href="#ticks" transform="rotate(180 256 256)"/>
    <use href="#ticks" transform="rotate(195 256 256)"/>
    <use href="#ticks" transform="rotate(210 256 256)"/>
    <use href="#ticks" transform="rotate(225 256 256)"/>
    <use href="#ticks" transform="rotate(240 256 256)"/>
    <use href="#ticks" transform="rotate(255 256 256)"/>
    <use href="#ticks" transform="rotate(270 256 256)"/>
    <use href="#ticks" transform="rotate(285 256 256)"/>
    <use href="#ticks" transform="rotate(300 256 256)"/>
    <use href="#ticks" transform="rotate(315 256 256)"/>
    <use href="#ticks" transform="rotate(330 256 256)"/>
    <use href="#ticks" transform="rotate(345 256 256)"/>
  </g>

  <!-- Inner rings -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#2E9BE8" stroke-width="1.5" opacity="0.35"/>

  <!-- Orbital node accents (blockchain motif) -->
  <circle cx="256" cy="40" r="7" fill="#F5B841"/>
  <circle cx="256" cy="472" r="7" fill="#2E9BE8"/>

  <!-- K monogram: vertical bar + diagonals, upper arm ends in a node -->
  <g stroke="url(#kGrad)" stroke-width="42" stroke-linecap="round" fill="none">
    <line x1="182" y1="148" x2="182" y2="364"/>
    <line x1="196" y1="256" x2="316" y2="150"/>
    <line x1="196" y1="256" x2="326" y2="364"/>
  </g>
  <!-- Node terminal on upper arm (staking/network node) -->
  <circle cx="342" cy="128" r="20" fill="#F5B841"/>
  <circle cx="342" cy="128" r="20" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.85"/>
  <!-- connector between arm and node -->
  <line x1="316" y1="150" x2="330" y2="139" stroke="#F5B841" stroke-width="10" stroke-linecap="round"/>
</svg>
